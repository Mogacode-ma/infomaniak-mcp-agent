name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + format check + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  secrets:
    name: Secret scan (gitleaks binary)
    runs-on: ubuntu-latest
    # We do NOT use gitleaks/gitleaks-action@v2 because that action now
    # requires a paid licence for organisation accounts. The plain
    # gitleaks binary stays MIT-licensed and free to run anywhere.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  audit:
    name: npm audit (production deps, informational only)
    runs-on: ubuntu-latest
    # Informational-only: this job NEVER fails the workflow. We surface
    # production-dep advisories in the logs, but the chrome-cookies-secure@2
    # dependency we rely on for local Chrome cookie extraction bundles
    # legacy modules with known advisories that we can't fix without
    # migrating to v3 or rolling our own SQLite reader (tracked separately).
    # Dev tools (vitest, tsup, eslint plugins…) drag in further transitive
    # vulnerabilities that don't ship to users.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run npm audit (logs only, never fails)
        run: |
          npm audit --omit=dev --audit-level=critical || true
          echo "::notice::npm audit ran in informational mode. Findings, if any, are in the log above."
