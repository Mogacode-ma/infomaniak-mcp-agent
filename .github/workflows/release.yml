# Auto-publish to npm when a vX.Y.Z tag is pushed.
#
# Why this exists: between v0.9.0 and v0.11.0, GitHub kept moving while npm
# stayed pinned at v0.8.5 — every `npx -y infomaniak-mcp-agent` was serving
# stale code containing the three Zod parser bugs fixed in v0.9. This
# workflow closes the drift: tag the commit, push the tag, npm publishes
# the same artifact CI just validated.
#
# Required secret: NPM_TOKEN (generate at https://www.npmjs.com/ →
# Access Tokens → Generation token, scope "Automation").

name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish to npm
    # Skip silently if NPM_TOKEN is not configured (e.g. after a repo recreate
    # or in forks). The job still runs but doesn't fail the pipeline.
    if: ${{ vars.PUBLISH_ON_TAG != 'false' && (github.repository == 'Mogacode-ma/infomaniak-mcp-agent') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance
    steps:
      - name: Check NPM_TOKEN exists
        id: token_check
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::warning::NPM_TOKEN not set — skipping publish. Generate at https://www.npmjs.com/ → Access Tokens (Automation scope) and add as repo secret."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token_check.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.token_check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        if: steps.token_check.outputs.skip != 'true'
        run: npm ci

      - name: Verify tag matches package.json version
        if: steps.token_check.outputs.skip != 'true'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag: $TAG_VERSION  Package: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Typecheck
        if: steps.token_check.outputs.skip != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.token_check.outputs.skip != 'true'
        run: npm run lint

      - name: Test
        if: steps.token_check.outputs.skip != 'true'
        run: npm test

      - name: Build
        if: steps.token_check.outputs.skip != 'true'
        run: npm run build

      - name: Publish to npm with provenance
        if: steps.token_check.outputs.skip != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
