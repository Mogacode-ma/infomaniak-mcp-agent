# Smithery.ai configuration — https://smithery.ai/docs
runtime: typescript
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      INFOMANIAK_API_TOKEN:
        type: string
        title: "Infomaniak API token"
        description: "Bearer token from https://manager.infomaniak.com/v3/api-token. Required."
      INFOMANIAK_AUTH_MODE:
        type: string
        title: "Manager-private auth mode"
        description: "auto (default — reads Chrome cookies), manual (uses SASESSION+XSRF env vars), or disabled."
        enum: ["auto", "manual", "disabled"]
        default: "auto"
      INFOMANIAK_SASESSION:
        type: string
        title: "Manager session cookie (manual mode only)"
        description: "Required only when INFOMANIAK_AUTH_MODE=manual."
      INFOMANIAK_XSRF_TOKEN:
        type: string
        title: "Manager XSRF token (manual mode only)"
        description: "Required only when INFOMANIAK_AUTH_MODE=manual."
    required: ["INFOMANIAK_API_TOKEN"]
  exampleConfig:
    INFOMANIAK_API_TOKEN: "your_bearer_token_here"
    INFOMANIAK_AUTH_MODE: "auto"
