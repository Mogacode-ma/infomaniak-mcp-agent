# Gitleaks configuration — public OSS-safe rules.
#
# We rely on the gitleaks default ruleset (~150 patterns: AWS keys,
# GitHub PATs, Google service-account keys, Slack tokens, …) plus three
# Infomaniak-specific patterns below. We do NOT hard-code any real
# customer / hosting names here — those would defeat the point of having
# a public secret-scan config in the first place.
#
# Run locally: `npm run secrets:scan`.

title = "infomaniak-mcp-agent — secret scan"

[extend]
useDefault = true

[[rules]]
id = "infomaniak-bearer-token"
description = "Long opaque token next to an Infomaniak Authorization header"
regex = '''[A-Za-z0-9_-]{80,}'''
keywords = ["INFOMANIAK_API_TOKEN", "Authorization: Bearer"]

[[rules]]
id = "infomaniak-sasession"
description = "SASESSION cookie value (manager.infomaniak.com session)"
regex = '''SASESSION\s*[=:]\s*['"]?[A-Za-z0-9]{20,}'''
keywords = ["SASESSION"]

[[rules]]
id = "infomaniak-xsrf"
description = "Infomaniak manager XSRF token (Laravel encrypted form)"
regex = '''(MANAGER-XSRF-TOKEN|X-XSRF-TOKEN)\s*[=:]\s*['"]?ey[A-Za-z0-9+/=%]{50,}'''
keywords = ["MANAGER-XSRF-TOKEN", "X-XSRF-TOKEN"]

# Allowlist: test snapshot fixtures may contain ephemeral confirmation_token
# UUIDs captured from real smoke runs. These are NOT secrets — they're
# single-use, 60-second-TTL tokens minted by the MCP for the two-phase
# commit safety pattern, expired long before any commit lands. Excluding
# them prevents gitleaks from flagging UUIDs as generic-api-key leaks.
[allowlist]
paths = [
  '''tests/snapshots/responses/.*\.json''',
]
description = "Ephemeral confirmation_token UUIDs in smoke test snapshots"
